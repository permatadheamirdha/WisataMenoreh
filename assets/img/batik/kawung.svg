<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Motif Kawung (gaya Yogyakarta): empat buah kawung (kolang-kaling) mengelilingi satu titik pusat.
       Digambar ulang sebagai pola berulang; warna sogan di atas latar krem. -->
  <rect width="40" height="40" fill="#f3eadb"/>
  <g fill="#7a4a26">
    <ellipse cx="10" cy="10" rx="11.5" ry="6.4" transform="rotate(45 10 10)"/>
    <ellipse cx="30" cy="30" rx="11.5" ry="6.4" transform="rotate(45 30 30)"/>
    <ellipse cx="30" cy="10" rx="11.5" ry="6.4" transform="rotate(-45 30 10)"/>
    <ellipse cx="10" cy="30" rx="11.5" ry="6.4" transform="rotate(-45 10 30)"/>
  </g>
  <g fill="none" stroke="#f3eadb" stroke-width="1">
    <ellipse cx="10" cy="10" rx="7.5" ry="3.2" transform="rotate(45 10 10)"/>
    <ellipse cx="30" cy="30" rx="7.5" ry="3.2" transform="rotate(45 30 30)"/>
    <ellipse cx="30" cy="10" rx="7.5" ry="3.2" transform="rotate(-45 30 10)"/>
    <ellipse cx="10" cy="30" rx="7.5" ry="3.2" transform="rotate(-45 10 30)"/>
  </g>
  <g fill="#f3eadb">
    <circle cx="10" cy="10" r="1.3"/><circle cx="30" cy="30" r="1.3"/>
    <circle cx="30" cy="10" r="1.3"/><circle cx="10" cy="30" r="1.3"/>
  </g>
  <!-- titik pusat (pusat kawung) di tengah dan di sudut -->
  <g fill="#2f3b52">
    <circle cx="20" cy="20" r="2.2"/>
    <circle cx="0" cy="0" r="2.2"/><circle cx="40" cy="0" r="2.2"/>
    <circle cx="0" cy="40" r="2.2"/><circle cx="40" cy="40" r="2.2"/>
  </g>
</svg>
